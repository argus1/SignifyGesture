name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.2"
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Frontend regression tests
        run: npm test
      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Synthetic evaluation reporting check
        run: |
          node --experimental-strip-types scripts/evaluate-asl.ts \
            fixtures/asl-evaluation/validation.json \
            fixtures/asl-evaluation/test.json 0.7
      - name: Existing ESLint baseline (advisory)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Report lint debt explicitly
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::warning::ESLint failed. Lint is advisory until the existing baseline is resolved."
          echo "### Advisory lint failure" >> "$GITHUB_STEP_SUMMARY"
          echo "ESLint failed; inspect the lint step. Existing baseline debt is not a new agent finding." >> "$GITHUB_STEP_SUMMARY"
