name: Native CI

on:
  push:
    branches: [dev, main]
    paths:
      - "iOSApp/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "iOSApp/**"
      - ".github/workflows/native-ci.yml"

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen if missing
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version
      - name: Generate project from source specification
        run: xcodegen generate --spec iOSApp/project.yml
      - name: Verify generated bundle identifiers
        run: |
          set -euo pipefail
          for configuration in Debug Release; do
            xcodebuild \
              -project iOSApp/SignifyGesture.xcodeproj \
              -alltargets \
              -configuration "$configuration" \
              -sdk iphoneos \
              -showBuildSettings -json |
              python3 -c '
          import json, sys
          settings = {entry["target"]: entry["buildSettings"] for entry in json.load(sys.stdin)}
          expected = {
              "SignifyGesture": "com.argussun.signifygesture2",
              "SignifyMessages": "com.argussun.signifygesture2.messages2",
              "SignifyGestureTests": "com.argussun.signifygesture2.tests",
          }
          for target, identifier in expected.items():
              actual = settings[target]["PRODUCT_BUNDLE_IDENTIFIER"]
              if actual != identifier:
                  raise SystemExit(f"{target}: expected {identifier}, got {actual}")
              print(f"{target}: {actual}")
          '
          done
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [device for runtime, devices in runtimes.items()
                    if "iOS-" in runtime for device in devices
                    if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator; native verification is blocked.")
          print(phones[0]["udid"])
          ')"
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run unsigned Debug simulator tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild \
            -project iOSApp/SignifyGesture.xcodeproj \
            -scheme SignifyGesture \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO test
      - name: Verify unsigned Release simulator build
        run: |
          xcodebuild \
            -project iOSApp/SignifyGesture.xcodeproj \
            -scheme SignifyGesture \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/signify-release" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify built iPad multitasking orientations
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "signify-release/Build/Products/Release-iphonesimulator/SignifyGesture.app/Info.plist"
          with path.open("rb") as source:
              info = plistlib.load(source)
          expected = {
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationPortraitUpsideDown",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          }
          actual = info.get("UISupportedInterfaceOrientations~ipad", info.get("UISupportedInterfaceOrientations", []))
          if set(actual) != expected:
              raise SystemExit(f"iPad multitasking requires all four orientations; got {actual}")
          if info.get("UIRequiresFullScreen", False):
              raise SystemExit("iPad multitasking must not be disabled with UIRequiresFullScreen")
          print("Built iPad bundle supports all four multitasking orientations.")
          PY
      - name: Verify embedded Messages extension
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          import subprocess
          from pathlib import Path

          app = Path(os.environ["RUNNER_TEMP"]) / "signify-release/Build/Products/Release-iphonesimulator/SignifyGesture.app"
          bundle = app / "PlugIns/SignifyMessages.appex"
          with (bundle / "Info.plist").open("rb") as source:
              info = plistlib.load(source)
          extension = info.get("NSExtension", {})
          if info.get("CFBundleIdentifier") != "com.argussun.signifygesture2.messages2":
              raise SystemExit("Messages extension bundle identifier is incorrect")
          if extension.get("NSExtensionPointIdentifier") != "com.apple.message-payload-provider":
              raise SystemExit("Messages extension point is incorrect")
          if extension.get("NSExtensionPrincipalClass") != "SignifyMessages.MessagesViewController":
              raise SystemExit("Messages extension principal class is incorrect")
          if info.get("MSMessagesExtensionStoreIconName") != "MessagesIcon":
              raise SystemExit("Messages extension store icon metadata is missing or incorrect")
          icons = info.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {}).get("CFBundleIconFiles", [])
          if not icons:
              raise SystemExit("Messages extension primary icon metadata is missing")
          required = {(180, 135), (120, 90), (148, 110), (64, 48),
                      (81, 60), (134, 100), (54, 40), (96, 72)}
          actual = set()
          for icon in bundle.glob("*.png"):
              if not any(icon.stem.startswith(name) for name in icons):
                  continue
              metadata = subprocess.check_output(
                  ["sips", "-g", "pixelWidth", "-g", "pixelHeight", str(icon)], text=True)
              dimensions = dict(line.strip().split(": ", 1) for line in metadata.splitlines()
                                if line.strip().startswith(("pixelWidth:", "pixelHeight:")))
              actual.add((int(dimensions["pixelWidth"]), int(dimensions["pixelHeight"])))
          if required - actual:
              raise SystemExit(f"Messages extension is missing compiled icon sizes: {sorted(required - actual)}")
          print("Messages extension is embedded with the expected metadata and all required icon sizes.")
          PY
