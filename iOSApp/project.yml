name: SignifyGesture

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.argussun.signifygesture
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: S8CKN5R4P7
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Config/Info.plist
    SIGNIFY_FRONTEND_URL: "http://localhost:5173"

schemes:
  SignifyGesture:
    build:
      targets:
        SignifyGesture: all
    run:
      config: Debug
    test:
      targets:
        - SignifyGestureTests

targets:
  SignifyGesture:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: SignifyGesture
        INFOPLIST_KEY_CFBundleDisplayName: SignifyGesture
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access enables on-device hand-pose tracking for the demo. Video is not saved or sent to the web UI."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Local network access can load the team’s development UI from your computer."
        INFOPLIST_KEY_SIGNIFY_FRONTEND_URL: "$(SIGNIFY_FRONTEND_URL)"
        CODE_SIGN_STYLE: Automatic

  SignifyGestureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SignifyGesture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argussun.signifygesture.tests
        GENERATE_INFOPLIST_FILE: YES
